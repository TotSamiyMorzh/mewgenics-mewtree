<!doctype html>
<html lang="ru"><!-- the script sets the language; Russian is the markup default, English sits in data-en -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Родословная колонии</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen pannable family graph (layers = generations) + detail panel (right / bottom sheet).
   Look borrowed from the game's family tree screen: mauve wallpaper, paper name plates, thick ink outlines. Single dark theme by choice. */
:root{
  --bg:#241d21; --surface:#342b30; --surface2:#463a40; --line:#120d10;
  --fg:#f3ebe6; --muted:#b9a9af; --accent:#f0c23b; --mut:#9fd35c;
  --blood:#e2584d; --dead:#8a7d83; --common:#6cc3d8; --gone:#a79fc0;
  --ink:#120d10; --paper:#e6dede; --wall:#2b2327; --thread:#b3a4aa;
  --display:"Rubik Mono One","Arial Black",sans-serif;
  --body:"Rubik",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-inline:16px;border-bottom:3px solid var(--ink);background:var(--surface);position:relative;z-index:2}
h1{font-family:var(--display);font-size:17px;letter-spacing:.02em;margin:0;color:var(--accent)}
.meta{font:11px var(--mono);color:var(--muted)}
.titles{display:flex;flex-direction:column;gap:3px;min-width:0}
.metarow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
#saveSel{font:700 12px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;box-shadow:0 2px 0 var(--ink);padding:2px 6px;max-width:min(430px,100%);cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
input#q{background:var(--bg);border:2px solid var(--ink);color:var(--fg);font:inherit;padding:6px 10px;border-radius:8px;width:240px;max-width:100%}
button{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font:700 13px var(--body);padding:5px 11px;border-radius:8px;cursor:pointer}
button:hover{background:#fff}
button:active{transform:translateY(2px);box-shadow:none}
button[aria-pressed="true"]{background:var(--accent)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-2px}
.seg button:first-child{border-radius:8px 0 0 8px;margin:0}
.seg button:last-child{border-radius:0 8px 8px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;touch-action:none;cursor:grab;display:block;background:var(--wall) center/auto}
#stage.drag{cursor:grabbing}
.legend{position:absolute;left:16px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--fg);background:color-mix(in srgb,var(--bg) 88%,transparent);border:2px solid var(--ink);padding:6px 10px;border-radius:8px;pointer-events:none;max-width:calc(100% - 392px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
aside{width:360px;flex-shrink:0;border-left:3px solid var(--ink);background:var(--surface);overflow-y:auto;padding-block:16px;padding-inline:18px}
@media (max-width:760px){
  .main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:3px solid var(--ink);max-height:50%}
  .legend{display:none}
}
/* a node is a paper name plate with an ink outline and a hard shadow, like the game's plates */
.node rect.card{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.node rect.sh{fill:#000;opacity:.6}
.node rect.halo{fill:none;stroke:none}
.node{cursor:pointer;transition:opacity .2s}
.node:hover rect.card{fill:#fff}
.node.dead rect.card{fill:#958a8e;stroke-dasharray:7 4}
.node.gone rect.card{fill:#bcb2b5;stroke-dasharray:2 5;stroke-linecap:round}
.node .nm{font:700 13px var(--body);font-size:var(--nn,13px);fill:var(--ink)}
.node .sub{font:11px var(--mono);fill:#55484d}
.node .rip{fill:#a32a23}
.node .left{fill:#54497c}
.node .home{fill:#35701a}
.node.lit rect.halo{stroke:var(--accent);stroke-width:3}
.node.sel rect.halo{stroke:var(--accent);stroke-width:6}
.node.common rect.halo{stroke:var(--common);stroke-width:5}
.node.pick rect.halo{stroke:var(--mut);stroke-width:6}
.node.dim{opacity:.25}
.node.ghost{opacity:.45}
.edge{fill:none;stroke:var(--thread);stroke-width:2.2;stroke-linecap:round;opacity:.75;transition:opacity .2s}
.edge.lit{stroke:var(--accent);stroke-width:3.4;opacity:1}
.edge.cm{stroke:var(--common);stroke-width:3.4;opacity:1}
.edge.dim{opacity:.18}
.jn{fill:var(--thread)}
.coi{font:600 10px var(--mono)}
#stage.far .sub,#stage.far .coi,#stage.far .stat{display:none}
.stat{color:#3f3439}
.stat text{font:700 10.5px var(--mono);fill:var(--ink)}
.stat text.up{fill:#2f6a14}
.stat text.dn{fill:#a32a23}
.stat text.lbl{font:600 7px var(--mono);fill:#55484d}
.stat .top7{fill:var(--accent);stroke:var(--ink);stroke-width:1.2}
.node.dead .stat .top7,.node.gone .stat .top7{fill:#d9bd62}
.stat line{stroke:var(--ink);stroke-width:1;opacity:.25}
#stage.far .nm{font-size:var(--nf,17px)}
.ph{display:flex;gap:12px;align-items:center}
.ph>svg{width:76px;height:76px;flex-shrink:0;background:var(--paper);border:2px solid var(--ink);border-radius:10px}
.cardbtn{all:unset;display:block;width:136px;flex-shrink:0;cursor:zoom-in;border-radius:10px}
.cardbtn:hover{filter:brightness(1.12)}
.cardbtn svg,#lb svg{display:block;width:100%;height:auto;overflow:visible}
.cardname{font:700 350px var(--body);fill:var(--ink)}
#lb{position:fixed;inset:0;z-index:10;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;padding:24px;background:rgba(18,13,16,.92);cursor:zoom-out;overflow:auto}
#lb[hidden]{display:none}
#lb .big{width:min(440px,80vw,70vh)}
#lb .bare{width:min(380px,80vw,60vh)}
#lb figure{margin:0;text-align:center;color:var(--muted);font:11px var(--mono)}
#lb .x{position:fixed;top:14px;right:16px}
.node .star{display:none;fill:var(--accent);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.node.fav .star,.node.pet .star{display:block}
.node.pet .star{fill:#ff7f9d}
.node.fav rect.card,.node.pet rect.card{fill:#f8e7a6}
.node.fav.dead rect.card,.node.pet.dead rect.card{fill:#c9bb85}
.node.fav.gone rect.card,.node.pet.gone rect.card{fill:#e2d39a}
#pet{all:unset;display:flex;flex-direction:row-reverse;align-items:center;gap:11px;cursor:pointer;max-width:min(520px,100%);border-radius:10px;margin-left:auto}
header.haspet .tools{flex-basis:100%;justify-content:flex-end}
#pet[hidden]{display:none}
#pet svg{width:56px;height:56px;flex-shrink:0;background:var(--paper);border:2px solid var(--ink);border-radius:50%}
#pet svg.pcard{width:96px;height:auto;margin-block:-6px;background:none;border:0;border-radius:0;overflow:visible}
#pet:hover svg{filter:brightness(1.1)}
.gold .frm{filter:url(#goldf)}
.bub{position:relative;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:0 2px 0 var(--ink);padding:6px 12px 7px;font-weight:700;font-size:14px;line-height:1.25}
.bub small{display:block;font:600 10px var(--mono);color:#55484d}
.bub::before{content:"";position:absolute;right:-9px;top:50%;translate:0 -50%;border:7px solid transparent;border-right:0;border-left-color:var(--ink)}
#fun{position:fixed;inset:0;z-index:9;background:rgba(18,13,16,.8);overflow:auto;padding:24px 16px}
#fun[hidden]{display:none}
.funbox{max-width:1000px;margin-inline:auto;background:var(--surface);border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);padding:18px 20px;position:relative}
.funbox h2{font-family:var(--display);font-size:18px;margin:0;color:var(--accent)}
.funbox .x{position:absolute;top:14px;right:16px}
.funrecs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.funrecs .rec b{font-size:15px;overflow-wrap:anywhere}
.aws{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}
.aw{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 9px;min-width:0}
.aw svg{width:52px;height:52px;flex-shrink:0}
.aw span{min-width:0;display:block}
.aw b{display:block;font:400 12px var(--display);line-height:1.2}
.aw em{display:block;font-style:normal;font-weight:700;overflow-wrap:anywhere}
.aw b,.aw small,.aw i{overflow-wrap:anywhere}
.tag{overflow-wrap:anywhere}
.top button b{min-width:0;overflow-wrap:anywhere}
.links button{overflow-wrap:anywhere;text-align:left}
.aw i{display:block;font:600 11px var(--mono);font-style:normal;color:#8a1f19}
.aw small{display:block;font-weight:400;font-size:11px;color:#55484d;line-height:1.25}
#settings{position:absolute;right:16px;top:calc(100% + 8px);width:290px;background:var(--surface);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);padding:10px 14px}
#settings[hidden]{display:none}
#settings label{display:flex;gap:9px;align-items:flex-start;padding-block:6px;cursor:pointer;line-height:1.3}
#settings input{margin-top:2px;accent-color:var(--accent)}
#settings small{display:block;color:var(--muted);font-size:11px}
#settings label.off{opacity:.5;cursor:default}
#settings label.lang{align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);margin-bottom:4px;padding-bottom:9px}
#langSel{font:700 13px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:2px 6px;cursor:pointer}
.ph h2{font-family:var(--display);font-size:15px;margin:0 0 4px;line-height:1.15;overflow-wrap:anywhere}
.tag{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--muted);margin:2px 4px 2px 0}
.tag.alive{color:var(--mut)} .tag.rip{color:var(--blood)} .tag.left{color:var(--gone)} .tag.warn{color:var(--accent)} .tag.bad{color:var(--blood)}
h3{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.stats{display:grid;grid-template-columns:38px 1fr 40px;gap:4px 8px;align-items:center;font:12px var(--mono);font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;display:flex}
.bar b{display:block;height:100%;background:var(--accent)}
.bar i{display:block;height:100%;background:var(--mut)}
.bar i.neg{background:var(--blood)}
.spells{display:flex;flex-direction:column;gap:6px}
.spell{background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:7px 9px;display:flex;gap:10px;align-items:center}
.spell .st{flex:1;min-width:0;overflow-wrap:anywhere}
.spell>svg{width:40px;height:40px;flex-shrink:0}
.ic{display:inline-block;vertical-align:-.15em;flex-shrink:0}
.tag .ic{margin-right:4px}
.stats .top7l{color:var(--accent)}
.stats .top7v{font-style:normal;font-weight:700;background:var(--accent);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;box-shadow:0 1.5px 0 var(--ink)}
.stats .top7b{outline:1.5px solid var(--accent);outline-offset:1.5px}
.stats>span:first-child,.stats>span:nth-child(3n+1){display:flex;align-items:center}
.node .ic{color:#55484d}
.node .ic.home{color:#35701a}
.node .sx0{color:#1d63ad;fill:#1d63ad}
.node .sx1{color:#c02f76;fill:#c02f76}
.node .sx2{color:#5b4e53;fill:#5b4e53}
.node .ori{font:700 12px var(--body)}
.node .ori.o0{fill:#3f3439}
.node .ori.o1{fill:#7437b0}
.node .ori.o2{fill:#bd4f00}
#stage.far .flag{display:none}
.tag .flag{vertical-align:-2px;margin-right:4px}
.legend .flag{vertical-align:-2px;margin-right:4px}
.spell b{font-weight:700;font-size:13px}
.spell em{font:600 10px var(--mono);font-style:normal;color:var(--accent);margin-left:6px;text-transform:uppercase;letter-spacing:.06em}
.spell span{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4}
.spell.passive{border-style:dashed;border-color:#6d5f66}
.spell.dis{border-color:var(--blood)} .spell.dis b{color:var(--blood)}
.spell.mutx{border-color:var(--mut)} .spell.mutx b{color:var(--mut)}
.spell.item{border-color:var(--surface2);background:var(--surface2)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rec{background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:7px 9px;min-width:0;overflow-wrap:anywhere}
.rec b{display:block;font:600 17px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.rec span{font-size:11px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{font-size:12px;padding:4px 9px}
.links button.d{background:#958a8e;text-decoration:line-through}
.links button.g{background:#bcb2b5}
.meter{font:700 30px var(--mono);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);line-height:1.5}
.top{display:flex;flex-direction:column;gap:6px}
.top button{display:flex;justify-content:space-between;gap:10px;text-align:left}
.top button span{color:#55484d;font:12px var(--mono)}
.warnbox{border:1px dashed var(--accent);color:var(--accent);border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.45;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titles"><h1 data-en="Colony family tree">Родословная колонии</h1>
    <span class="metarow"><select id="saveSel" aria-label="Какой сейв показывать" data-en-aria="Which save to show" hidden></select><span class="meta" id="meta"></span></span></div>
    <button id="pet" hidden></button>
    <div class="tools">
      <input id="q" type="search" placeholder="Найти кота…" data-en-ph="Find a cat…" aria-label="Найти кота" data-en-aria="Find a cat" list="names">
      <datalist id="names"></datalist>
      <div class="seg" role="group" aria-label="Кого показывать" data-en-aria="Who to show">
        <button data-mode="house" aria-pressed="true" data-en="House lines">Линии дома</button>
        <button data-mode="fam" aria-pressed="false" data-en="All families">Все семьи</button>
        <button data-mode="all" aria-pressed="false" data-en="All cats">Все коты</button>
        <button data-mode="fav" aria-pressed="false" data-en="★ Favourites">★ Избранные</button>
        <button data-mode="line" aria-pressed="false" id="lineBtn" hidden></button>
      </div>
      <button id="pairBtn" aria-pressed="false" data-en="Compare a pair">Сравнить пару</button>
      <button id="deadBtn" aria-pressed="false" data-en="Dim the departed">Приглушить ушедших</button>
      <button id="fitBtn" data-en="Fit">Вписать</button>
      <button id="funBtn" aria-pressed="false" data-en="Fun stats">Приколы</button>
      <button id="setBtn" aria-pressed="false" aria-controls="settings" data-en="Settings">Настройки</button>
    </div>
    <div id="settings" hidden>
      <label class="lang"><span data-en="Language">Язык</span><select id="langSel"><option value="ru">Русский</option><option value="en">English</option></select></label>
      <label><input type="checkbox" data-opt="faces"><span><span data-en="Faces from the game">Морды из игры</span><small data-en="On the tree plates. Turn off if the page is slow: plain icons instead.">На карточках древа. Выключи, если страница тормозит: будут простые иконки.</small></span></label>
      <label><input type="checkbox" data-opt="stats"><span><span data-en="Stats on the plates">Статы на плашках</span><small data-en="Seven stats under the name: glyph and total (base + levelling and injuries). Green: a bonus, red: a penalty. Gold: born with a 7.">Семь статов под именем: значок и итог (база + прокачка и травмы). Зелёный — есть прибавка, красный — штраф. Золотая подложка — врождённая семёрка.</small></span></label>
      <label><input type="checkbox" data-opt="full"><span><span data-en="Whole cat">Кот в полный рост</span><small data-en="In the side panel, in the game's frame. Click the frame for a big view.">В панели справа, в рамке из игры. Клик по рамке открывает крупно.</small></span></label>
      <label><input type="checkbox" data-opt="font"><span><span data-en="Game font">Шрифт из игры</span><small data-en="The hand-written Mewgenics font instead of a regular one.">Рукописный шрифт Mewgenics вместо обычного.</small></span></label>
      <label><input type="checkbox" data-opt="wall"><span><span data-en="Game wallpaper">Обои из игры</span><small data-en="The tree's background, as on the game's family tree screen.">Фон древа, как на экране родословной.</small></span></label>
      <small id="ver" style="display:block;text-align:right;color:var(--muted);font-size:11px;margin-top:4px"></small>
    </div>
  </header>
  <div class="main">
    <svg id="stage" aria-label="Граф родословной" data-en-aria="Family tree graph">
      <defs>
        <filter id="gray"><feColorMatrix type="saturate" values="0.1"/><feComponentTransfer><feFuncR type="linear" slope=".72"/><feFuncG type="linear" slope=".72"/><feFuncB type="linear" slope=".72"/></feComponentTransfer></filter>
        <filter id="goldf" color-interpolation-filters="sRGB"><feFlood flood-color="#f2c230"/><feComposite in2="SourceAlpha" operator="in" result="g"/>
          <feOffset in="SourceAlpha" dy="-90" result="o"/><feFlood flood-color="#a8720c"/><feComposite in2="SourceAlpha" operator="in"/><feComposite in2="o" operator="out" result="sh"/>
          <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/></feMerge></filter>
        <filter id="fade"><feColorMatrix type="saturate" values="0.45"/></filter>
      </defs>
      <g id="world"><g id="edges"></g><g id="nodes"></g></g>
    </svg>
    <div class="legend">
      <span><i style="background:var(--paper)"></i><span data-en="at home">в доме</span></span>
      <span><i style="background:#958a8e"></i><span data-en="dead">погиб</span></span>
      <span><i style="background:#bcb2b5"></i><span data-en="left alive">ушёл живым</span></span>
      <span><i style="background:#f8e7a6"></i><span data-en="favourite">избранный</span></span>
      <span id="lgFlags"></span>
      <span><i style="background:var(--mut);border-radius:50%"></i><span data-en="mutations">мутации</span></span>
      <span><i style="background:var(--accent)"></i><span data-en="line of the selected cat">линия выбранного</span></span>
      <span><i style="background:var(--common)"></i><span data-en="common ancestors">общие предки</span></span>
    </div>
    <aside id="panel"></aside>
  </div>
</div>
<div id="lb" hidden></div>
<div id="fun" hidden></div>
<script>
// The page holds every save build_tree.py found; DATA = the shared game art and texts + the chosen save.
const ALL = /*__MEWTREE_DATA__*/null;
let SAVESEL=null;
try{if(ALL.force&&localStorage.getItem('mewtree.force')!==ALL.force){localStorage.setItem('mewtree.force',ALL.force);localStorage.setItem('mewtree.save',ALL.def)}
  SAVESEL=localStorage.getItem('mewtree.save')}catch(e){}
const DATA=Object.assign({},ALL,ALL.saves.find(s=>s.saveKey===SAVESEL)||ALL.saves.find(s=>s.saveKey===ALL.def)||ALL.saves[0]);
// ---------- language: Russian or English, for the page's own words and for the game's texts ----------
let LANG=null;try{LANG=localStorage.getItem('mewtree.lang')}catch(e){}
if(LANG!=='ru'&&LANG!=='en')LANG=ALL.lang||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');
const RU=LANG==='ru',tr=(ru,en)=>RU?ru:en;
document.documentElement.lang=LANG;
if(!RU){DATA.npc=DATA.npcEn||DATA.npc;DATA.quotes=DATA.quotesEn||DATA.quotes;document.title='Colony family tree';
  document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset.en);
  document.querySelectorAll('[data-en-ph]').forEach(e=>e.placeholder=e.dataset.enPh);
  document.querySelectorAll('[data-en-aria]').forEach(e=>e.setAttribute('aria-label',e.dataset.enAria))}
// counted nouns: P(3,'cat') -> "3 кота" / "3 cats"
const WORDS={cat:[['кот','кота','котов'],['cat','cats']],ofcat:[['кота','котов','котов'],['cat','cats']],
  kitten:[['котёнок','котёнка','котят'],['kitten','kittens']],desc:[['потомок','потомка','потомков'],['descendant','descendants']],
  mut:[['мутация','мутации','мутаций'],['mutation','mutations']],defect:[['дефект','дефекта','дефектов'],['defect','defects']],

  const nb=(id,dir)=>dir<0?par(id):kid(id);

  for(let it=0;it<10;it++){
    const down=it%2===0;
    const seq=down?rows.map((_,i)=>i):rows.map((_,i)=>rows.length-1-i);
    seq.forEach(i=>{const row=rows[i];const key={};
      row.forEach(id=>{const n=nb(id,down?-1:1);
        // keep mates together: a parent also looks at its mates through shared kids
        key[id]=n.length?avg(n.map(x=>ord[x])):ord[id]});
      row.sort((a,b)=>key[a]-key[b]);row.forEach((id,j)=>ord[id]=j)})}
  // x coordinates
  const x={};rows.forEach(row=>row.forEach((id,i)=>x[id]=i*(W+GX)));
  const resolve=row=>{for(let i=1;i<row.length;i++){const m=x[row[i-1]]+W+GX;if(x[row[i]]<m)x[row[i]]=m}
    for(let i=row.length-2;i>=0;i--){const m=x[row[i+1]]-W-GX;if(x[row[i]]>m)x[row[i]]=Math.max(m,x[row[i]]-(x[row[i]]-m))}};
  for(let it=0;it<24;it++){
    const down=it%2===0;
    (down?rows:rows.slice().reverse()).forEach(row=>{
      row.forEach(id=>{const n=[...par(id),...kid(id)];if(n.length)x[id]=x[id]*.3+.7*avg(n.map(v=>x[v]))});
      // keep order, push apart symmetrically
      for(let pass=0;pass<3;pass++){
        for(let i=1;i<row.length;i++){const a=row[i-1],b=row[i],ov=x[a]+W+GX-x[b];if(ov>0){x[a]-=ov/2;x[b]+=ov/2}}}
      for(let i=1;i<row.length;i++){const m=x[row[i-1]]+W+GX;if(x[row[i]]<m)x[row[i]]=m}})}
  const minx=Math.min(...ids.map(id=>x[id]));
  const pos={};ids.forEach(id=>pos[id]={x:x[id]-minx+W/2,y:rank[id]*(H+GY)+H/2});
  return{pos,w:Math.max(...ids.map(id=>x[id]))-minx+W,h:rows.length*(H+GY)-GY}}

function layout(){
  shown=visibleSet();const list=all.filter(c=>shown.has(c.id));
  // connected components
  const comp={},groups=[];
  list.forEach(c=>{if(comp[c.id]!=null)return;const g=[],st=[c.id];comp[c.id]=groups.length;
    while(st.length){const id=st.pop();g.push(id);[...cats[id].p,...cats[id].kids].forEach(n=>{if(shown.has(n)&&comp[n]==null){comp[n]=groups.length;st.push(n)}})}
    groups.push(g)});
  const fams=groups.filter(g=>g.length>1).sort((a,b)=>b.length-a.length),singles=groups.filter(g=>g.length===1).map(g=>g[0]);
  const pos={};let ox=0,maxH=0;
  fams.forEach(g=>{const L=layoutComponent(g);g.forEach(id=>pos[id]={x:L.pos[id].x+ox,y:L.pos[id].y});ox+=L.w+120;maxH=Math.max(maxH,L.h)});
  if(singles.length){singles.sort((a,b)=>({house:0,dead:1,gone:2}[cats[a].st]-{house:0,dead:1,gone:2}[cats[b].st])||a-b);
    const cols=Math.max(4,Math.ceil(Math.sqrt(singles.length*2.2)));const y0=fams.length?maxH+180:0;
    singles.forEach((id,i)=>pos[id]={x:(i%cols)*(W+GX)+W/2,y:y0+Math.floor(i/cols)*(H+24)+H/2})}
  // edges: one junction per parent pair, then a curve to each kid
  let eh='';const fam={};
  list.forEach(c=>{const ps=c.p.filter(p=>shown.has(p));if(!ps.length)return;const k=ps.slice().sort((a,b)=>a-b).join('_');(fam[k]||=[]).push(c.id)});
  for(const k in fam){const ps=k.split('_').map(Number),kids=fam[k];
    const jx=ps.reduce((s,p)=>s+pos[p].x,0)/ps.length,py=Math.max(...ps.map(p=>pos[p].y))+H/2;
    const ky=Math.min(...kids.map(id=>pos[id].y))-H/2,jy=py+Math.min(GY/2,(ky-py)/2);
    ps.forEach(p=>{const a=pos[p];eh+=`<path class="edge" data-p="${p}" data-k="${kids.join('_')}" d="M${a.x},${a.y+H/2} C${a.x},${jy} ${jx},${a.y+H/2} ${jx},${jy}"/>`});
    kids.forEach(id=>{const b=pos[id],ty=b.y-H/2;eh+=`<path class="edge" data-p="${k}" data-k="${id}" d="M${jx},${jy} C${jx},${(jy+ty)/2} ${b.x},${(jy+ty)/2} ${b.x},${ty}"/>`});
    if(ps.length>1)eh+=`<circle class="jn" cx="${jx}" cy="${jy}" r="3.5"/>`}
  edgesG.innerHTML=eh;edgeEls=[...edgesG.querySelectorAll('.edge')];
  nodesG.innerHTML=list.map(c=>{const p=pos[c.id],x=p.x-W/2,y=p.y-H/2;
    const mark=c.st==='dead'?'<tspan class="rip">†</tspan>':c.st==='gone'?'<tspan class="left">↗</tspan>':`<tspan class="home">${SEX[c.sex]??''}</tspan>`;
    const nm=c.n.length>22?c.n.slice(0,21)+'…':c.n;
    const l3=[c.lvl?tr('ур.','lv.')+c.lvl:'',c.st==='gone'?`<tspan class="left">${tr('ушёл','left')}</tspan>`:'',c.coi>0?`<tspan fill="${coiColor(c.coi)}">${(c.coi*100).toFixed(1)}%</tspan>`:''].filter(Boolean).join(' · ');
    return`<g class="node ${c.st}" data-id="${c.id}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(c.n)}">
      <rect class="sh" x="3" y="4" width="${W}" height="${H}" rx="12"/><rect class="halo" x="-5" y="-5" width="${W+10}" height="${H+10}" rx="16"/>
      <rect class="card" width="${W}" height="${H}" rx="12"/>
      <svg x="5" y="4" width="56" height="56" viewBox="0 0 64 64">${catIcon(c)}</svg>
      <text class="nm" x="66" y="${l3?18:24}">${esc(nm)}</text>${nodeSub(c,l3?39:46)}
      ${l3?`<text class="sub coi" x="66" y="58">${l3}</text>`:''}${on('stats')?statStrip(c):''}<path class="star" d="${STAR}" transform="translate(-8,-9) scale(1.15)"/>
      ${c.mut.length?`<circle cx="${W-11}" cy="11" r="5" stroke="var(--ink)" stroke-width="1.5" fill="${c.mut.some(m=>m[4])?'var(--blood)':'var(--mut)'}"><title>${tr('мутации','mutations')}: ${c.mut.length}</title></circle>`:''}</g>`}).join('');
  nodeEls={};nodesG.querySelectorAll('.node').forEach(el=>nodeEls[el.dataset.id]=el);
  fitNames();

// Long names: shrink the font until the name fits the plate (and the bigger zoomed-out size separately).
function fitNames(){const far=svg.classList.contains('far');svg.classList.remove('far');
  for(const id in nodeEls){const t=nodeEls[id].querySelector('.nm');t.style.removeProperty('--nn');t.style.removeProperty('--nf');
    const room=W-66-(cats[id].mut.length?24:9),w=t.getComputedTextLength();
    if(w>room)t.style.setProperty('--nn',Math.max(8,13*room/w).toFixed(1)+'px');
    if(w*17/13>room)t.style.setProperty('--nf',Math.max(8,13*room/w).toFixed(1)+'px');
    for(const u of nodeEls[id].querySelectorAll('text.sub')){u.removeAttribute('textLength');   // a long class name ("Necromancer") is squeezed to the plate
      const x=+u.getAttribute('x'),uw=u.getComputedTextLength();
      if(x+uw>W-7){u.setAttribute('textLength',Math.max(10,W-7-x).toFixed(1));u.setAttribute('lengthAdjust','spacingAndGlyphs')}}}
  svg.classList.toggle('far',far)}

function apply(){
  const lit=new Set(),common=new Set();
  if(pairMode&&pick.length===2){const A=anc(pick[0]),B=anc(pick[1]);A.forEach(x=>B.has(x)&&common.add(x));
    const climb=id=>{cats[id].p.forEach(p=>{const pa=anc(p);pa.add(p);if([...common].some(x=>pa.has(x))&&!lit.has(p)){lit.add(p);climb(p)}})};
    pick.forEach(p=>{lit.add(p);climb(p)})}
  else if(!pairMode&&sel!=null){lit.add(sel);anc(sel).forEach(x=>lit.add(x));desc(sel).forEach(x=>lit.add(x))}
  const any=lit.size>0;
  for(const id in nodeEls){const el=nodeEls[id],c=cats[id];
    el.classList.toggle('fav',favs.has(c.id));el.classList.toggle('pet',c.id===pet);
    el.classList.toggle('sel',!pairMode&&c.id===sel);el.classList.toggle('pick',pairMode&&pick.includes(c.id));
    el.classList.toggle('common',common.has(c.id));el.classList.toggle('lit',lit.has(c.id));
    el.classList.toggle('dim',any&&!lit.has(c.id)&&!common.has(c.id));
    el.classList.toggle('ghost',muteGone&&c.st!=='house'&&!lit.has(c.id))}
  edgeEls.forEach(e=>{const ps=e.dataset.p.split('_'),ks=e.dataset.k.split('_');
    const ok=ps.some(x=>lit.has(+x))&&ks.some(x=>lit.has(+x))&&(ps.length>1||ks.length>1||true);
    e.classList.toggle('lit',ok&&!pairMode);e.classList.toggle('cm',ok&&pairMode);e.classList.toggle('dim',any&&!ok)});
  renderPanel()}

function fit(){const r=svg.getBoundingClientRect(),b=bounds();T.k=Math.min(r.width/(b.x1-b.x0),r.height/(b.y1-b.y0),1.1)*.95;
  T.x=r.width/2-(b.x0+b.x1)/2*T.k;T.y=r.height/2-(b.y0+b.y1)/2*T.k;draw()}

function zoomAt(px,py,f){const k=Math.min(3,Math.max(.05,T.k*f));T.x=px-(px-T.x)*k/T.k;T.y=py-(py-T.y)*k/T.k;T.k=k;draw()}

    const fight=dead.filter(c=>bit(c,18)).length,old=dead.filter(c=>bit(c,10)).length;
    add(fight,tr('полегли в бою','fell in battle'));add(old,tr('умерли от старости. Повезло','died of old age. Lucky them'));
    add(dead.length-dead.filter(c=>bit(c,18)||bit(c,10)).length,tr('погибли иначе: не в бою и не от старости. Несчастный случай, ага','died some other way: not in battle, not of old age. An "accident", sure'));
    for(let b=11;b<=17;b++){const n=all.filter(c=>bit(c,b)).length;if(n)add(n,tr('отдано: ','given to: ')+esc(NPC[b]||'NPC'))}
    add(house.filter(c=>bit(c,1)).length||null,tr('пенсионеров в доме (в походы больше не ходят)','retirees at home (no more adventures)'));
  }
  const fates=sec(tr('Куда они все делись','Where did they all go'));
  return`<div class="funbox"><button class="x" data-close>${tr('Закрыть','Close')}</button><h2>${tr('Приколы колонии','Colony fun stats')}</h2>
    ${colony}${love}${fates}
    <h3>${tr('Доска почёта и позора','Wall of fame and shame')}</h3><div class="aws">${cards}</div>
    <p class="hint">${tr('Всё посчитано из сейва. При равенстве показан первый по списку. Клик по коту открывает его на древе.','Everything is counted from the save. On a tie the first one in the list is shown. Click a cat to open it on the tree.')}</p></div>`}
function toggleFun(show){fun.hidden=!show;fun.innerHTML=show?funHtml():'';document.getElementById('funBtn').setAttribute('aria-pressed',show)}
document.getElementById('funBtn').onclick=()=>toggleFun(fun.hidden);
fun.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){toggleFun(false);if(pairMode)togglePair();go(+g.dataset.go);return}
  if(e.target===fun||e.target.closest('[data-close]'))toggleFun(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!fun.hidden)toggleFun(false)});
// settings: remembered in this browser; an option whose game art is missing is shown disabled
const setBtn=document.getElementById('setBtn'),setBox=document.getElementById('settings');
function applyOpt(k){
  if(!k||k==='wall')svg.classList.toggle('wall',on('wall'));
  if(k==='faces'||k==='stats'){sizeNodes();const t={...T};layout();T=t;draw()}
  if(k==='full')renderPanel();
  if(!k||k==='font'){const st=document.getElementById('gamefont');if(st)st.disabled=!on('font')}}
setBox.querySelectorAll('[data-opt]').forEach(i=>{const k=i.dataset.opt;i.checked=on(k);i.disabled=!HAS[k];i.closest('label').classList.toggle('off',!HAS[k]);
  i.onchange=()=>{opt[k]=i.checked;try{localStorage.setItem('mewtree.opt',JSON.stringify(opt))}catch(e){}applyOpt(k)}});
setBtn.onclick=()=>{setBox.hidden=!setBox.hidden;setBtn.setAttribute('aria-pressed',!setBox.hidden)};
addEventListener('pointerdown',e=>{if(!setBox.hidden&&!e.target.closest('#settings,#setBtn')){setBox.hidden=true;setBtn.setAttribute('aria-pressed',false)}});
applyOpt();
document.getElementById('names').innerHTML=all.map(c=>`<option value="${esc(c.n)}">`).join('');
document.getElementById('q').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();if(!v)return;
  const c=all.find(c=>c.n.toLowerCase()===v)||all.find(c=>c.n.toLowerCase().startsWith(v))||all.find(c=>c.n.toLowerCase().includes(v));if(c){if(pairMode)togglePair();e.target.value='';e.target.blur();go(c.id)}});
if(all.some(c=>c.sx!=null))document.getElementById('lgFlags').outerHTML=[0,1,2].map(o=>`<span>${flag(o,17,11)}${ORI_L[o]}</span>`).join('');
const saveSel=document.getElementById('saveSel');
if(ALL.saves.length>1){saveSel.hidden=false;
  const pad=n=>String(n).padStart(2,'0');
  const saveLabel=s=>{const l=s.label;if(!l||typeof l==='string')return l||s.save;const d=new Date((l.mtime||0)*1000);
    return[l.account||(l.steamid?'Steam '+l.steamid:''),l.file+(l.test?tr(' [тест]',' [test]'):'')+(l.proton?' [Proton]':''),
      l.mtime?`${pad(d.getDate())}.${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'',
      l.day!=null?tr('день ','day ')+l.day+(l.house!=null?tr(', дома ',', at home ')+l.house:''):''].filter(Boolean).join(' · ')};
  saveSel.innerHTML=ALL.saves.map(s=>`<option value="${esc(s.saveKey)}"${s.saveKey===DATA.saveKey?' selected':''}>${esc(saveLabel(s))}</option>`).join('');
  saveSel.onchange=()=>{try{localStorage.setItem('mewtree.save',saveSel.value)}catch(e){}location.reload()}}
document.getElementById('meta').textContent=`${ALL.saves.length>1?'':DATA.save+' · '}${tr('день','day')} ${DATA.day??'?'} · ${P(all.length,'cat')} · ${tr('собрано','built')} ${DATA.built}`;
document.getElementById('ver').textContent='MewTree '+(ALL.ver||'');
const langSel=document.getElementById('langSel');langSel.value=LANG;
langSel.onchange=()=>{try{localStorage.setItem('mewtree.lang',langSel.value)}catch(e){}location.reload()};
window.addEventListener('resize',()=>fit());
layout();
</script>
</body>
</html>
